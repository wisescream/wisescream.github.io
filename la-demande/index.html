<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101c35">
<title>La Demande — Casablanca</title>
<style>
:root{--night:#101c35;--ocre:#c88a45;--terra:#a9573d;--gold:#d5a84c;--ivory:#e8dcc4;--green:#263d35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1222;color:var(--ivory);font-family:Inter,system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}.pill{background:#101c35cc;border:1px solid #d5a84c55;border-radius:999px;padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(8px)}#clock{font-variant-numeric:tabular-nums}.objective{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#101c35cc;border:1px solid #e8dcc433;border-radius:10px;padding:8px 14px;font-size:13px;opacity:.95}.dialog{position:absolute;left:5%;right:5%;bottom:5%;background:linear-gradient(180deg,#101c35eF,#0b1222F5);border:1px solid #d5a84c66;border-radius:18px;padding:18px 20px;box-shadow:0 18px 50px #0008;pointer-events:auto;display:none}.dialog.show{display:block}.speaker{color:var(--gold);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.line{font-size:18px;line-height:1.45;margin:8px 0 12px}.hint{font-size:11px;opacity:.55;text-align:right}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{flex:1;min-width:120px;background:#263d35;border:1px solid #d5a84c55;color:var(--ivory);padding:11px;border-radius:11px;font-weight:700}.choice:active{transform:scale(.98)}.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto}.panel{width:min(92vw,520px);background:#101c35f5;border:1px solid #d5a84c66;border-radius:22px;padding:28px;box-shadow:0 30px 80px #0009;text-align:center}.title{font-size:38px;font-weight:900;letter-spacing:-.04em;margin:0 0 8px}.subtitle{opacity:.75;line-height:1.5}.btn{margin-top:18px;border:0;border-radius:13px;background:var(--gold);color:#15120c;padding:13px 22px;font-size:15px;font-weight:900}.hidden{display:none!important}.mobile{position:absolute;bottom:18px;left:18px;width:100px;height:100px;border-radius:50%;border:1px solid #e8dcc422;background:#101c3588;pointer-events:auto}.stick{position:absolute;width:42px;height:42px;left:29px;top:29px;border-radius:50%;background:#d5a84c88}.tap{position:absolute;right:20px;bottom:28px;display:grid;gap:8px;pointer-events:auto}.tap button{width:72px;height:48px;border-radius:14px;border:1px solid #e8dcc444;background:#101c35cc;color:var(--ivory);font-weight:900}.mini{position:absolute;inset:0;background:#101c35ee;display:flex;align-items:center;justify-content:center;pointer-events:auto}.miniBox{width:min(92vw,560px);background:#15233e;border:1px solid #d5a84c66;border-radius:20px;padding:22px}.bar{height:22px;background:#0b1222;border-radius:12px;overflow:hidden;border:1px solid #ffffff18}.fill{height:100%;width:0;background:var(--gold)}.slider{width:100%;accent-color:var(--gold)}.pool{height:210px;border-radius:16px;background:#174a3b;border:12px solid #6d4228;position:relative;overflow:hidden;margin:15px 0}.ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#f4ead5;left:28%;top:48%;box-shadow:0 1px 4px #0008}.hole{position:absolute;width:28px;height:28px;background:#080b10;border-radius:50%}.h1{left:-4px;top:-4px}.h2{right:-4px;top:-4px}.h3{left:-4px;bottom:-4px}.h4{right:-4px;bottom:-4px}.h5{left:50%;top:-10px}.h6{left:50%;bottom:-10px}.zellige{position:absolute;inset:0;opacity:.045;background-image:linear-gradient(45deg,transparent 42%,#d5a84c 43%,#d5a84c 57%,transparent 58%),linear-gradient(-45deg,transparent 42%,#d5a84c 43%,#d5a84c 57%,transparent 58%);background-size:44px 44px;pointer-events:none}
</style>
</head><body>
<div id="game"></div><div class="zellige"></div>
<div class="hud"><div class="top"><div class="pill">LA DEMANDE · CASABLANCA</div><div class="pill" id="clock">19:12</div></div><div class="objective" id="objective">Il est temps d'y aller.</div><div class="dialog" id="dialog"><div class="speaker" id="speaker"></div><div class="line" id="line"></div><div class="choices" id="choices"></div><div class="hint">Touchez pour continuer</div></div></div>
<div class="mobile" id="joy"><div class="stick" id="stick"></div></div><div class="tap"><button id="interact">INTERAGIR</button><button id="run">COURIR</button></div>
<div class="center" id="start"><div class="panel"><h1 class="title">La Demande</h1><div class="subtitle">Une soirée à Casablanca. Quelque chose se prépare.<br>Mais Reda ne dira pas encore quoi.</div><button class="btn" id="startBtn">COMMENCER</button></div></div>
<div class="mini hidden" id="mini"><div class="miniBox" id="miniContent"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);let scene,camera,renderer,red,world=[],act=0,sub=0,started=false,dialogLock=false,flowers='white',outfit='blue',keys={},joy={x:0,y:0},running=false;
const clockText=['19:12','19:27','19:58','20:07','20:19','20:31'];
function mat(c,r=.8){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0})}const M={night:mat(0x101c35),ocre:mat(0xc88a45),terra:mat(0xa9573d),gold:mat(0xd5a84c),ivory:mat(0xe8dcc4),green:mat(0x263d35),red:mat(0xa92d2d),blue:mat(0x1d416d)};
function box(x,y,z,sx,sy,sz,m,px=0,py=0,pz=0){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(px,py,pz);o.castShadow=true;o.receiveShadow=true;scene.add(o);world.push(o);return o}
function cyl(r,h,m,x,y,z){let o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,10),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);world.push(o);return o}
function textSprite(t,scale=1){let c=document.createElement('canvas');c.width=512;c.height=128;let x=c.getContext('2d');x.fillStyle='#e8dcc4';x.font='bold 42px system-ui';x.textAlign='center';x.fillText(t,256,72);let s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(4*scale,1*scale,1);return s}
function clearWorld(){world.forEach(o=>scene.remove(o));world=[]}
function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x172642);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);camera.position.set(0,5,8);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('game').appendChild(renderer.domElement);let hemi=new THREE.HemisphereLight(0xe8dcc4,0x101c35,2);scene.add(hemi);let sun=new THREE.DirectionalLight(0xffd18a,2.2);sun.position.set(-8,14,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);red=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.9,4,8),M.blue);body.position.y=1.05;red.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.31,12,8),M.ivory);head.position.y=1.85;red.add(head);let leg1=box(0,0,0,.18,.7,.18,M.night,-.18,.35,0);let leg2=box(0,0,0,.18,.7,.18,M.night,.18,.35,0);red.add(leg1,leg2);scene.add(red);let ground=box(0,0,0,70,.2,70,mat(0x5f4935),0,-.1,0);world.push(ground);buildApartment();animate()}
function buildApartment(){clearWorld();let ground=box(0,0,0,18,.2,16,mat(0x7a5a42),0,-.1,0);box(0,0,0,18,5,.3,M.terra,0,2.5,-7);box(0,0,0,.3,5,14,M.terra,-9,2.5,0);box(0,0,0,.3,5,14,M.terra,9,2.5,0);box(0,0,0,5,2.8,.35,M.ocre,-5,1.4,-6.8);box(0,0,0,5,2.8,.35,M.ocre,5,1.4,-6.8);cyl(.5,.2,M.gold,-5,1.6,-5.8);cyl(.35,.2,M.ivory,5,1.5,-5.7);let frame=box(0,0,0,1.4,1.2,.12,M.night,2,1.5,-6.55);frame.rotation.z=.2;let bed=box(0,0,0,4,.55,2.2,M.green,-4,.3,2.5);box(0,0,0,4,1.1,.25,M.terra,-4,.7,3.55);box(0,0,0,2.2,.35,1.1,M.ocre,3,.25,3);red.position.set(0,0,4)}
function buildCasablanca(){clearWorld();let g=box(0,0,0,55,.2,45,mat(0x8a6548),0,-.1,0);box(0,0,0,55,.1,8,mat(0x302b2a),0,.02,0);for(let i=-20;i<=20;i+=7){let h=4+Math.random()*5;box(0,0,0,5,h,5,[M.ocre,M.terra,M.ivory][Math.floor(Math.random()*3)],i,h/2,-9);box(0,0,0,5,h,5,[M.ocre,M.terra,M.ivory][Math.floor(Math.random()*3)],i,h/2,10)}for(let i=0;i<9;i++){let x=-24+i*6;cyl(.45,2,M.green,x,1,5);cyl(.8,.25,M.green,x,2,5)}red.position.set(-20,0,0)}
function buildBristol(){clearWorld();box(0,0,0,28,.2,22,mat(0x382b25),0,-.1,0);box(0,0,0,28,6,.4,M.green,0,3,-10);box(0,0,0,.4,6,20,M.green,-14,3,0);box(0,0,0,.4,6,20,M.green,14,3,0);for(let x=-10;x<=10;x+=5){let neon=box(0,0,0,3.6,.08,.08,[M.red,M.gold,M.blue][(x+10)/5%3],x,3.8,-9.7);neon.material.emissive=neon.material.color;neon.material.emissiveIntensity=1.8}poolTable(-5,1);poolTable(6,-3);red.position.set(0,0,7)}
function poolTable(x,z){box(0,0,0,5,.6,2.6,M.green,x,.5,z);box(0,0,0,5.5,.8,.25,M.ocre,x,.8,z-1.45);box(0,0,0,5.5,.8,.25,M.ocre,x,.8,z+1.45);for(let dx of [-2.5,2.5])for(let dz of [-1.2,1.2])cyl(.16,.3,M.night,x+dx,.9,z+dz)}
function buildFinal(){clearWorld();let g=box(0,0,0,30,.2,24,mat(0x2c2a2b),0,-.1,0);box(0,0,0,30,5,.2,M.night,0,2.5,-11);for(let x=-12;x<=12;x+=3){let b=cyl(.1,1.5,M.gold,x,1, -6);let l=new THREE.PointLight(0xffb15c,2,7);l.position.set(x,1.8,-6);scene.add(l)}for(let i=-7;i<=7;i+=3)cyl(.18,.8,M.terra,i,.4,1);let table=box(0,0,0,4,.4,2,M.ocre,0,.35,-1);let city=[];for(let i=0;i<22;i++){let h=2+Math.random()*7;let b=box(0,0,0,1.2,h,.8,M.blue,-12+i*1.1,h/2,-8);city.push(b)}red.position.set(-2,0,2)}
function showDialog(speaker,line,choices=[]){$('speaker').textContent=speaker;$('line').textContent=line;$('choices').innerHTML='';choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=c.label;b.onclick=()=>{hideDialog();c.fn()};$('choices').appendChild(b)});$('dialog').classList.add('show');dialogLock=true}
function hideDialog(){$('dialog').classList.remove('show');dialogLock=false}
function next(){if(dialogLock){hideDialog();continueAct()}}
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')||e.target===$('line'))next()});
function continueAct(){sub++;runScene()}
function setAct(n){act=n;sub=0;$('clock').textContent=clockText[n];runScene()}
function runScene(){
$('objective').textContent=['Il est temps d\'y aller.','Traverse le quartier.','Retrouve tes amis au Bristol.','Prépare le lieu.','Elle arrive bientôt.','Un dernier moment.'][act];
if(act===0){buildApartment();if(sub===0)showDialog('Reda','Je crois que j\'ai tout… enfin, presque.');else if(sub===1)showDialog('Yassine','Alors, prêt pour ce soir ?');else if(sub===2)showDialog('Reda','J\'espère.');else if(sub===3)showDialog('SMS — Yassine','T\'as tout ?');else if(sub===4)showDialog('Reda','Presque.');else if(sub===5){showDialog('Reda','Pas maintenant.');}else setAct(1)}
if(act===1){buildCasablanca();if(sub===0)showDialog('Vendeur','Khoya, tu cherches quelque chose ?');else if(sub===1)showDialog('Reda','Non, merci. Je suis juste pressé.');else if(sub===2)showDialog('Vendeur','Pressé comme ça, ça sent les problèmes.');else if(sub===3)showDialog('Chauffeur','Bristol ?');else if(sub===4)showDialog('Reda','Non, je vais marcher.');else if(sub===5)showShop();else setAct(2)}
if(act===2){buildBristol();if(sub===0)showDialog('Yassine','Ahhh, voilà monsieur !');else if(sub===1)showDialog('Amine','Pourquoi t\'as l\'air d\'un mec qui va passer un entretien ?');else if(sub===2)showDialog('Reda','J\'ai juste eu une longue journée.');else if(sub===3)startPool();else if(sub===4)showDialog('Mehdi','T\'es bizarre ce soir…');else if(sub===5)startDiversion();else if(sub===6)showDialog('Yassine','T\'as tout ?');else if(sub===7)showDialog('Reda','Oui.');else if(sub===8)showDialog('Yassine','Elle ne se doute de rien.');else setAct(3)}
if(act===3){buildFinal();if(sub===0)showDialog('Reda','Il faut que tout soit parfait.');else if(sub===1)showFlowers();else if(sub===2)startCandles();else if(sub===3)showDialog('Souvenir','Quelques secondes plus tôt…');else setAct(4)}
if(act===4){buildFinal();if(sub===0)showDialog('Elle','Tu m\'as demandé de venir ici… pourquoi ?');else if(sub===1)showDialog('Reda','Pour rien. Je voulais juste te voir.');else if(sub===2)showDialog('Elle','Tu es vraiment bizarre ce soir.');else if(sub===3)showDialog('Reda','Ça me fait plaisir que tu sois là.',[{label:'Continuer',fn:()=>setAct(5)}]);}
if(act===5){buildFinal();if(sub===0)finale()}
}
function showShop(){showDialog('Fleuriste','Pour quelqu\'un de spécial ?', [{label:'Roses rouges',fn:()=>{flowers='red';continueAct()}},{label:'Fleurs blanches',fn:()=>{flowers='white';continueAct()}},{label:'Orangées',fn:()=>{flowers='orange';continueAct()}}])}
function showFlowers(){showDialog('Reda','Choisir les fleurs…',[{label:'Rouges',fn:()=>{flowers='red';continueAct()}},{label:'Blanches',fn:()=>{flowers='white';continueAct()}},{label:'Orangées',fn:()=>{flowers='orange';continueAct()}}])}
function startPool(){let c=$('miniContent');$('mini').classList.remove('hidden');c.innerHTML='<h2>Partie de billard</h2><p>Trois coups. Angle puis puissance.</p><div class="pool"><div class="hole h1"></div><div class="hole h2"></div><div class="hole h3"></div><div class="hole h4"></div><div class="hole h5"></div><div class="hole h6"></div><div class="ball"></div></div><input class="slider" id="angle" type="range" min="0" max="100" value="50"><div class="bar"><div class="fill" id="power"></div></div><button class="btn" id="shot">TIRER</button>';let p=0,dir=1;let timer=setInterval(()=>{p+=dir*2;if(p>100||p<0)dir*=-1;$('power').style.width=p+'%'},30);$('shot').onclick=()=>{clearInterval(timer);let a=+$('angle').value;let score=Math.max(0,100-Math.abs(a-58)*2-Math.abs(p-62));$('mini').classList.add('hidden');showDialog('Amine',score>70?'Sérieusement ?':'HA ! Je savais que t\'étais pas concentré.',[{label:'Continuer',fn:()=>continueAct()}])}}
function startDiversion(){let c=$('miniContent');$('mini').classList.remove('hidden');c.innerHTML='<h2>Diversion</h2><p>Choisis vite quelque chose à dire.</p><div class="choices"><button class="choice" id="d1">Regardez ça !</button><button class="choice" id="d2">Qui rejoue ?</button><button class="choice" id="d3">J\'ai une question.</button></div>';['d1','d2','d3'].forEach(id=>$(id).onclick=()=>{$('mini').classList.add('hidden');showDialog('Mehdi','Ok, ok… on regarde !', [{label:'Profiter de la diversion',fn:()=>continueAct()}])})}
function startCandles(){let c=$('miniContent');$('mini').classList.remove('hidden');c.innerHTML='<h2>Préparer la lumière</h2><p>Touchez les trois emplacements.</p><div class="choices"><button class="choice" id="c1">Bougie 1</button><button class="choice" id="c2">Bougie 2</button><button class="choice" id="c3">Bougie 3</button></div><p id="count">0 / 3</p>';let n=0;['c1','c2','c3'].forEach(id=>$(id).onclick=()=>{if(!$(id).disabled){$(id).disabled=true;n++;$('count').textContent=n+' / 3';if(n===3){$('mini').classList.add('hidden');showDialog('Reda','Voilà. Maintenant, il ne manque plus qu\'elle.',[{label:'Continuer',fn:()=>continueAct()}])}}})}
function finale(){let c=$('miniContent');$('mini').classList.remove('hidden');c.innerHTML='<h1 class="title">Ce soir.</h1><p class="subtitle">Reda s\'avance. Il prend une inspiration.<br>Le monde ralentit.</p><button class="btn" id="words">DIRE LES MOTS</button>';$('words').onclick=()=>{c.innerHTML='<h1 class="title">Veux-tu m\'épouser ?</h1><p class="subtitle">Un instant suspendu à Casablanca.</p><button class="btn" id="yes">OUI</button>';$('yes').onclick=ending}}
function ending(){let c=$('miniContent');c.innerHTML='<h1 class="title">Oui.</h1><p class="subtitle">20:31 · Casablanca<br><br>Une soirée à retenir.</p><button class="btn" onclick="location.reload()">REJOUER</button>';buildFinal();let glow=new THREE.PointLight(0xffd27a,5,15);glow.position.set(0,3,0);scene.add(glow)}
function move(){if(!started)return;let s=running?.12:.065;let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+joy.x;let dz=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0)+joy.y;red.position.x+=dx*s;red.position.z+=dz*s;red.position.x=Math.max(-12,Math.min(12,red.position.x));red.position.z=Math.max(-8,Math.min(8,red.position.z));camera.position.lerp(new THREE.Vector3(red.position.x,4.2,red.position.z+7),.08);camera.lookAt(red.position.x,1,red.position.z)}
function animate(){requestAnimationFrame(animate);move();renderer.render(scene,camera)}
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '&&!dialogLock)continueAct()});window.addEventListener('keyup',e=>keys[e.key]=false);$('startBtn').onclick=()=>{$('start').classList.add('hidden');started=true;runScene()};$('interact').onclick=()=>{if(dialogLock)next();else continueAct()};$('run').onpointerdown=()=>running=true;$('run').onpointerup=()=>running=false;
let joyEl=$('joy');joyEl.addEventListener('pointermove',e=>{if(e.buttons===0)return;let r=joyEl.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/(r.width/2),y=(e.clientY-(r.top+r.height/2))/(r.height/2);let l=Math.hypot(x,y)||1;joy.x=Math.max(-1,Math.min(1,x/l*Math.min(1,l)));joy.y=Math.max(-1,Math.min(1,y/l*Math.min(1,l)));$('stick').style.transform=`translate(${joy.x*25}px,${joy.y*25}px)`});['pointerup','pointercancel','pointerleave'].forEach(ev=>joyEl.addEventListener(ev,()=>{joy.x=joy.y=0;$('stick').style.transform=''}));window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setup();
</script></body></html>
